extends = "base.example.toml"
profile = "raspberry-pi"

[storage_roots]
media = "/mnt/retrotv-media/media"
state = "/var/lib/retrotv"
normalized = "/mnt/retrotv-media/normalized"
previews = "/var/lib/retrotv/previews"
originals_backup = "/mnt/retrotv-media/originals-backup"

[platform]
name = "linux"
player_ipc = "unix"
service = "systemd"
input_adapters = ["keyboard", "infrared", "cec"]

[web]
host = "0.0.0.0"
port = 8765

[player]
backend = "mpv"
fullscreen = true
